name: Cap nhat ton kho tu Google Sheet

on:
  schedule:
    # DU PHONG. Lich chinh nam o Google Apps Script (2-HEN-GIO-BANG-GOOGLE.gs)
    # vi schedule cua GitHub hay bi bo qua.
    # GitHub chay theo gio UTC. Viet Nam = UTC+7.
    # UTC 1h-14h = VN 8h-21h, moi 30 phut.
    - cron: '0,30 1-14 * * *'
  workflow_dispatch:          # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cai thu vien
        run: pip install --quiet cryptography

      - name: Lay ton kho va ma hoa
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          PW_KH: ${{ secrets.PW_KH }}
          PW_NB: ${{ secrets.PW_NB }}
          NB_SECRET: ${{ secrets.NB_SECRET }}
        run: python build_tonkho.py

      - name: Day len GitHub
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tonkho.json tonkho.hash
          git diff --staged --quiet && echo "Khong co thay doi" || \
            (git commit -m "Cap nhat ton kho $(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')" && git push)
