name: Cap nhat ton kho tu Google Sheet

on:
  schedule:
    # GitHub chạy theo giờ UTC. Việt Nam = UTC+7.
    # Khung giờ mong muốn: VN 7h17 -> 21h17. Ngoài khung đó không chạy.
    # Đặt HAI mốc phút khác nhau: GitHub hay bỏ qua lịch khi quá tải,
    # lỡ mất mốc này thì 30 phút sau còn mốc kia.
    - cron: '17 0-14 * * *'     # VN 7h17, 8h17 ... 21h17
    - cron: '47 0-13 * * *'     # du phong: VN 7h47, 8h47 ... 20h47
  workflow_dispatch:          # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cai thu vien
        run: pip install --quiet cryptography

      - name: Lay ton kho va ma hoa
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          PW_KH: ${{ secrets.PW_KH }}
          PW_NB: ${{ secrets.PW_NB }}
          NB_SECRET: ${{ secrets.NB_SECRET }}
        run: python build_tonkho.py

      - name: Day len GitHub
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tonkho.json tonkho.hash
          git diff --staged --quiet && echo "Khong co thay doi" || \
            (git commit -m "Cap nhat ton kho $(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')" && git push)
